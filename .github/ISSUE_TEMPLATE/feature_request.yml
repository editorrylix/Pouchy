name: Feature idea
description: Suggest something that would make Pouchy more useful (or cuter).
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation. What's slow, annoying or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How would you like Pouchy to handle it?
  - type: dropdown
    id: impact
    attributes:
      label: Which workflow would this improve most?
      options:
        - Attaching files from multiple folders
        - Collecting screenshots for bug reports/support
        - Moving or copying files between folders/apps
        - Organizing links/notes/images across shelves
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, examples from other apps, links.
